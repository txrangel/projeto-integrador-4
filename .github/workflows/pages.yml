# Publica a pasta site/ no GitHub Pages.
#
# O modo "Deploy from a branch" do Pages só aceita a raiz ou /docs, e o painel
# mora em site/. Este workflow contorna isso enviando só essa pasta.
#
# Necessário uma vez, no GitHub: Settings > Pages > Source = "GitHub Actions".

name: Publicar painel

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
